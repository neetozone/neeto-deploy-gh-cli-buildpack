api = "0.10"

[buildpack]
  description = "A buildpack for installing and configuring GitHub CLI"
  homepage = "https://github.com/cli/cli"
  id = "neeto-deploy/github-cli"
  keywords = ["github", "cli", "gh"]
  name = "Neeto Deploy Buildpack for GitHub CLI"
  version = "1.0.0"

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/unni/github-cli-buildpack/blob/main/LICENSE"

[metadata]
  include-files = ["bin/build", "bin/detect", "bin/run", "buildpack.toml"]

[[stacks]]
  id = "*"

[[targets]]
os = "linux"
arch = "amd64"

[[targets]]
os = "linux"
arch = "arm64" 